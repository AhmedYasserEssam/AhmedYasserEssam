name: Pacman Game Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-pacman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Generate Pacman animation
        run: |
          cat > pacman.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="400"
               height="100"
               viewBox="0 0 400 100">

            <style>
              @keyframes movePacman {
                from {
                  transform: translateX(0);
                }

                to {
                  transform: translateX(300px);
                }
              }

              .pacman {
                fill: #ffff00;
                animation: movePacman 4s linear infinite;
              }

              .dot {
                fill: #ffffff;
              }
            </style>

            <rect width="400" height="100" fill="#000000"/>

            <circle class="dot" cx="120" cy="50" r="5"/>
            <circle class="dot" cx="160" cy="50" r="5"/>
            <circle class="dot" cx="200" cy="50" r="5"/>
            <circle class="dot" cx="240" cy="50" r="5"/>
            <circle class="dot" cx="280" cy="50" r="5"/>
            <circle class="dot" cx="320" cy="50" r="5"/>

            <path
              class="pacman"
              d="M50 50 L80 35
                 A30 30 0 1 0 80 65 Z"
            />
          </svg>
          EOF

          sed \
            's/#000000/#111111/g; s/#ffffff/#eeeeee/g' \
            pacman.svg > pacman-dark.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add pacman.svg pacman-dark.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Pacman animation"
            git push origin output
          fi
